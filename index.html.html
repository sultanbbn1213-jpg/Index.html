<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دروس التقنية الرقمية 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: warm paper, slate hero card, magenta accent, pill stage tabs, blue-framed teacher board. */
:root{
  --paper:#FBF8F8; --surface:#FFFFFF; --ink:#1D2A30; --muted:#5E6A70; --line:#E3DADD; --grid:transparent;
  --brand:#C0306A; --on-brand:#FFFFFF; --soft:#FBE6EE; --slate:#37474F; --blue:#1B6CA8; --th:#F3ECEF; --bd:#EFE9EB;
  --u1:#C0306A; --u2:#1B6CA8; --u3:#9A5B0E; --u4:#6B4FA3;
  --hi:#F2B632; --good:#1E8E4E; --good-bg:#E1F3E7; --bad:#B93A2B; --bad-bg:#FBE7E3;
  --f-display:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161316; --surface:#211C21; --ink:#F3ECEF; --muted:#B7A9B0; --line:#3A3037; --grid:transparent;
    --brand:#E0568C; --on-brand:#1E0A13; --soft:#3A1E2C; --slate:#2B363C; --blue:#6AB0E6; --th:#2B242A; --bd:#3A3037;
    --u1:#E0568C; --u2:#6AB0E6; --u3:#E0A04A; --u4:#B79CF0;
    --hi:#F2B632; --good:#4BD17E; --good-bg:#14301F; --bad:#FF8C7C; --bad-bg:#3A1C18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#161316; --surface:#211C21; --ink:#F3ECEF; --muted:#B7A9B0; --line:#3A3037; --grid:transparent;
  --brand:#E0568C; --on-brand:#1E0A13; --soft:#3A1E2C; --slate:#2B363C; --blue:#6AB0E6; --th:#2B242A; --bd:#3A3037;
  --u1:#E0568C; --u2:#6AB0E6; --u3:#E0A04A; --u4:#B79CF0;
  --hi:#F2B632; --good:#4BD17E; --good-bg:#14301F; --bad:#FF8C7C; --bad-bg:#3A1C18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.8;
  padding-block:0 48px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;margin:0;text-wrap:balance;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto}
.wrap.wide{max-width:1120px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px}
.mark{display:grid;gap:3px;width:30px}
.mark i{display:block;height:6px;border-radius:3px;background:var(--brand)}
.mark i:nth-child(1){width:70%;margin-inline-start:30%}
.mark i:nth-child(2){width:100%;background:var(--u2)}
.mark i:nth-child(3){width:55%;background:var(--u3)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.chip.ok{color:var(--good);border-color:var(--good)}
.chip.warn{color:var(--bad);border-color:var(--bad)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:99px;padding:9px 22px;font-weight:600;min-height:44px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* hero card */
.hcard{background:var(--slate);color:#fff;border-radius:26px;padding:24px;display:grid;gap:14px;margin-top:6px}
.hcard .eyebrow{color:#B9C6CC;font-size:15px;font-weight:500;letter-spacing:0}
.hcard h1{font-size:clamp(30px,8vw,42px);color:#fff;line-height:1.3}
.hcard p.lead{color:#D5DEE2;font-size:17px;line-height:1.9;margin:0}
.go{justify-self:start;border:0;background:var(--brand);color:var(--on-brand);border-radius:99px;padding:6px 26px;min-height:46px;font-size:19px;font-weight:700}
.go:hover{filter:brightness(1.08)}
.hcard .hint{color:#D5DEE2;font-size:16px}
.hcard .who{margin:0;padding:0;background:none;border:0;gap:12px;grid-template-columns:1fr auto}
.hcard .who label{color:#D5DEE2;font-size:14px;font-weight:500}
.hcard .who input{background:#fff;color:#1D2A30;border:0;border-radius:18px;min-height:50px;font-size:19px;padding:8px 18px}
.hcard .who input::placeholder{color:#7A878D}
.hcard .who input:focus{outline:3px solid var(--hi);outline-offset:1px}
.pts{display:flex;align-items:baseline;gap:8px;background:rgba(255,255,255,.14);border-radius:18px;padding:8px 18px;min-height:56px;align-self:end}
.pts b{font-size:38px;line-height:1.2;font-weight:700}
.pts span{font-size:16px;color:#D5DEE2}
.prog{display:flex;align-items:center;gap:14px;color:#D5DEE2;font-size:16px}
.ptrack{flex:1;height:12px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.ptrack i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.pills{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;margin-top:14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.stg{flex:none;display:inline-flex;align-items:center;gap:12px;min-height:48px;padding:6px 20px 6px 8px;border:1.5px solid var(--line);border-radius:99px;background:var(--surface);font-size:18px;font-weight:500}
.stg .bd{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bd);font-size:15px;font-weight:700}
.stg.done .bd{background:var(--good);color:#fff}
.stg.cur{border-color:var(--brand);background:var(--soft)}
@media (max-width:520px){.hcard .who{grid-template-columns:1fr}.pts{justify-self:start}}
/* hero */
.hero{padding-block:22px 10px}
.hero h1{font-size:clamp(28px,6vw,40px)}
.hero p.lead{max-width:60ch;color:var(--muted);margin-top:10px;font-size:17px}
.who{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:22px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.who label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.who input{padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-height:44px;min-width:0}
.who input:focus{border-color:var(--brand)}
@media (max-width:520px){.who{grid-template-columns:1fr}}

/* units & lesson cards */
.unit{margin-top:34px}
.unit-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.unit-h h2{font-size:24px}
.unit-h .eyebrow{color:var(--uc)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.lcard{text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px;align-content:start;border-top:5px solid var(--uc)}
.lcard:hover{border-color:var(--uc);transform:translateY(-2px)}
.lcard h3{font-size:19px}
.lcard .no{font-size:13px;color:var(--muted);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mini i{height:8px;border-radius:99px;background:var(--line)}
.mini i.on{background:var(--uc)}
@media (prefers-reduced-motion:no-preference){.lcard{transition:transform .15s,border-color .15s}}

/* lesson view */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;margin-top:18px;display:grid;gap:16px}
.panel h2{font-size:24px}
.panel h3{font-size:19px}
.panel > .eyebrow{color:var(--uc)}
.goals{margin:0;padding-inline-start:20px;display:grid;gap:4px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:16px;background:var(--paper);min-height:48px}
.opt:hover{border-color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:700;background:var(--surface)}
.opt.sel{border-color:var(--brand);background:var(--soft)}
.opt.sel .k{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .k{background:var(--good);color:var(--paper);border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.note{padding:12px 14px;border-radius:12px;background:var(--soft);border-inline-start:5px solid var(--brand)}
.note.bad{background:var(--bad-bg);border-color:var(--bad)}
.note.good{background:var(--good-bg);border-color:var(--good)}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--paper);display:grid;gap:8px}
.card h3{display:flex;gap:10px;align-items:center}
.card h3 em{font-style:normal;flex:none;width:30px;height:30px;border-radius:8px;background:var(--uc);color:var(--paper);display:grid;place-items:center;font-size:15px}
.card ul{margin:0;padding-inline-start:20px;display:grid;gap:2px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow span.s{padding:6px 14px;border-radius:99px;background:var(--uc);color:var(--paper);font-weight:600;font-size:15px}
.flow span.a{color:var(--muted);font-weight:700}
.shapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.shapes div{display:grid;justify-items:center;gap:4px;text-align:center;font-size:14px;padding:10px;border:1px dashed var(--line);border-radius:12px}
.shapes svg{width:76px;height:50px;stroke:var(--uc);stroke-width:2.5;fill:var(--soft)}
.qa{display:grid;gap:10px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.qa:last-child{border-bottom:0;padding-bottom:0}
.qa .q{font-weight:600}
.tf{display:flex;gap:10px}
.tf .opt{width:auto;flex:1;justify-content:center}
select.sel,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-height:44px}
textarea{min-height:100px;resize:vertical}
select.sel:focus,textarea:focus{border-color:var(--brand)}
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score b{font-family:var(--f-display);font-size:44px;line-height:1}
.meter{height:12px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--uc)}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--hi)}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;font-size:14px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper)}
.stat b{display:block;font-family:var(--f-display);font-size:28px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate .opt{width:auto;min-width:48px;justify-content:center}

/* teacher */
.teacher .panel{border:3px solid var(--blue)}
.teacher .panel>h2{color:var(--blue)}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.filters label{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
.filters select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);font-size:15px;white-space:nowrap}
th{font-size:14px;color:var(--ink);font-weight:600;background:var(--th)}
tbody tr.r{cursor:pointer}
tbody tr.r:hover{background:var(--soft)}
td.detail{white-space:normal;background:var(--paper);padding:16px}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--line);color:var(--ink)}
.pill.g{background:var(--good-bg);color:var(--good)}
.pill.b{background:var(--bad-bg);color:var(--bad)}
.pill.h{background:var(--hi);color:#2a2000}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) 120px 44px;gap:10px;align-items:center;font-size:14px}
@media (max-width:520px){.hbar{grid-template-columns:minmax(0,1fr) 70px 40px}}
.hbar span{min-width:0;overflow-wrap:anywhere}
.ans{padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.empty{padding:28px;text-align:center;color:var(--muted)}
.fig{margin:6px 0 0;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:grid;gap:8px}
.fgs svg{display:block;width:100%;height:auto;max-width:520px;margin-inline:auto}
.fig figcaption{font-size:14px;color:var(--muted);text-align:center}
.fgs text{fill:var(--ink);font-family:inherit;font-size:14px;text-anchor:middle}
.fgs text.b{font-weight:700;font-size:16px}
.fgs text.s{fill:var(--muted);font-size:12.5px}
.fgs text.m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.fgs .bx{fill:var(--surface);stroke:var(--uc);stroke-width:2}
.fgs .bx.hi{fill:var(--soft)}
.fgs .ar{stroke:var(--muted);stroke-width:2;fill:none;marker-end:url(#ah)}
.fgs .bar{fill:var(--uc)}
.fgs .bar.b2{fill:var(--hi)}
.fgs .blk{fill:var(--soft);stroke:var(--uc);stroke-width:2}
.fgs .blk.b2{fill:var(--surface)}
.vid .vl{justify-content:flex-start;text-align:start;text-decoration:none;color:var(--ink);display:flex;align-items:center;line-height:1.5;padding-block:8px}
.dash{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));margin-top:18px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:12px;align-content:start}
.dcard h3{font-family:var(--f-display);font-size:19px;margin:0}
.dcard .sub{font-size:14px;color:var(--muted);margin:0}
.dbars{display:grid;gap:8px}
.br{display:grid;grid-template-columns:minmax(0,150px) 1fr 46px;gap:10px;align-items:center;font-size:14px;min-height:28px}
.br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .tr{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.br .fl{height:100%;border-radius:0 7px 7px 0;background:var(--brand)}
.br .vl{font-variant-numeric:tabular-nums;text-align:end;font-weight:700}
.br:hover .tr,.br:focus-visible .tr{outline:2px solid var(--ink)}
.band{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden}
.band i{display:block;min-width:0}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.leg span{display:inline-flex;align-items:center;gap:6px}
.leg b{width:12px;height:12px;border-radius:3px;display:inline-block}
.help li{margin:4px 0}

.foot{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}
</style>
</head>
<body>


<div id="app"></div>

<script>
(function(){
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','ar');
var NF=new Intl.NumberFormat('en-US');
function N(x){return NF.format(x)}
function pct(a,b){return b?Math.round(a*100/b):0}

/* ---------- content (المصدر: كتاب التقنية الرقمية 3 - نظام المسارات - السنة الثالثة - طبعة 1448) ---------- */
var UNITS=[
 {id:'u1',n:'الوحدة الأولى',t:'تخطيط المشروعات',c:'var(--u1)'},
 {id:'u2',n:'الوحدة الثانية',t:'دورة حياة النظام',c:'var(--u2)'},
 {id:'u3',n:'الوحدة الثالثة',t:'تطبيقات الهواتف الذكية',c:'var(--u3)'},
 {id:'u4',n:'قسم',t:'الذكاء الاصطناعي',c:'var(--u4)'}
];
var YN=['صح','خطأ'];
var LESSONS=[
{id:'L1',u:'u1',t:'أساسيات تخطيط المشروع',pg:'9–22',
 hook:{q:'مدرستك تريد المشاركة في مسابقة الروبوت. ما الذي ينبغي أن تفعله أولاً؟',o:['أشتري القطع فوراً دون خطة','أضع خطة تحدد الأهداف والمهام والوقت والتكلفة، وأحدد مدير المشروع','أنتظر حتى يقترب موعد المسابقة'],g:1,
  r:'يوضح الكتاب أن عدم وجود خطة لإدارة المشروع يؤدي إلى ضياع الوقت وضعف الأداء، لذلك يلزم تنظيم المشروع وإدارته بأكثر الطرق فعالية.'},
 goals:['أعرّف المشروع وإدارة المشروع، وأشرح مثلث إدارة المشروع.','أذكر عناصر تخطيط المشروع ومراحل دورة حياة خطة المشروع.','أميّز الخطط المتفرعة عن خطة المشروع، وأشرح إدارة التكاليف وتعيين الموارد.','أحدد واجبات مدير المشروع ومعايير اختيار فريق العمل.'],
 cards:[
  ['المشروع وإدارة المشروع','المشروع سلسلة من الأنشطة أو المهام الواجب إنجازها خلال إطار زمني محدد وضمن ميزانية محددة للتوصل إلى منتج أو خدمة. أما إدارة المشروع فهي العملية التي تتضمن مراحل البدء والتخطيط والتنفيذ والتحكم والإغلاق لتحقيق أهداف محددة في زمن محدد. تمكّن إدارة المشروعات من:',['توفير الوقت والجهد بالتركيز على الأولويات.','التغلب على الصعوبات وتقليل احتمالات الفشل.','تحقيق درجة عالية من المتابعة.','التكيف مع المتغيرات.','إدارة الميزانية المخصصة للمشروع بفاعلية.'],null,'9'],
  ['مثلث إدارة المشروع','تشكل العناصر الرئيسة الثلاثة مثلث إدارة المشروع، وهو نموذج يساعد المديرين على تحقيق الجودة بالحفاظ على التوازن بينها. النطاق هو المهام المطلوبة لتحقيق أهداف المشروع، والزمن هو جدوله الزمني، والتكلفة هي ميزانيته. إذا زاد نطاق العمل فسيؤثر ذلك حتماً في زمن الانتهاء أو في التكلفة أو في كليهما. وتنقسم التكاليف إلى:',['تكاليف ثابتة: مثل رواتب العمال والإيجارات.','تكاليف متغيرة: مثل الكهرباء والمياه والمواد المستخدمة في الإنتاج.'],null,'9–10'],
  ['تخطيط المشروع وخطة المشروع','تخطيط المشروع هو كيفية إتمام مشروع في إطار زمني محدد وبمراحل وموارد معينة. وخطة المشروع وثيقة رسمية تساعد في مراقبة المشروع وتنفيذه، وتُقسَّم إلى مهام وأنشطة أصغر. عناصر تخطيط المشروع:',['تحديد نطاق المشروع.','تطوير خطة المشروع.','تحديد مخاطر المشروع.','تحديد أدوار ومسؤوليات المشروع.','تحديد معالم المشروع.','مراقبة المشروع والتحكم فيه.'],null,'10–11'],
  ['فوائد تخطيط المشروع','',['تحسين النتائج.','انخفاض التكاليف.','زيادة الكفاءة.','تعزيز مشاركة أصحاب المصلحة.','تحسين إدارة المخاطر.'],null,'11'],
  ['دورة حياة خطة المشروع','توفر دورة حياة خطة المشروع إطاراً لإدارة الحياة الكاملة للمشروع من بدايته إلى نهايته، وتتكون من خمس مراحل. في البدء يُحدد المشروع وأهدافه ونطاقه. في التخطيط تُطوَّر خطة مفصلة. في التنفيذ تُوضع الخطة قيد العمل. في المراقبة والتحكم يُتابع التقدم وتُتخذ الإجراءات التصحيحية. وفي الإنهاء يُسلَّم المشروع إلى العميل أو صاحب المصلحة.',null,['البدء','التخطيط','التنفيذ','المراقبة والتحكم','الإنهاء'],'12'],
  ['الخطط المتفرعة عن خطة المشروع','تتفرع من خطة المشروع خطط أخرى تضيف إلى جودة المنتج النهائي:',['خطة الموارد: احتياجات المشروع من الموارد وكمياتها وطرق توفيرها ومتابعة استهلاكها.','الخطة المالية: حساب التكلفة التقديرية، ثم وضع الميزانية، ثم التحكم في النفقات (وهي العملية الأكثر تحدياً).','خطة القبول: معايير قبول المشروع ومتسلماته وأدوات قياس جودتها.','خطة التواصل: إبقاء أصحاب المصلحة على اطلاع دائم بمجريات المشروع.','خطة المشتريات: شراء المنتجات والخدمات من الموردين الخارجيين.','خطة المخاطر: السيطرة على المشكلات المحتملة وتحديد أولوياتها.'],null,'12–14'],
  ['إدارة التكاليف وتقدير التكلفة','إدارة التكاليف هي عملية تقدير التكاليف المرتبطة بالمشروع والتخطيط لها والتحكم بها، وتشمل إنشاء الميزانية ومراقبة النفقات. عناصر تقدير تكلفة المشروع:',['الموارد البشرية.','المواد والمعدات.','المنشآت.','الموردون.','التحديات والمخاطر.'],null,'14–15'],
  ['تحديات تقدير التكلفة','يظل تقدير التكلفة أمراً غير سهل، ومن مشكلاته:',['الاستعجال في التقدير قبل اتضاح المتطلبات.','قلة الخبرة لدى القائمين على التقدير.','انحياز العنصر البشري إلى تقليل التكلفة.','ضغوط الإدارة وأصحاب المصلحة لتقليلها.'],null,'15'],
  ['تعيين الموارد والعمل الجماعي','تعيين الموارد هو عملية تحديد وتنظيم جميع الموارد اللازمة لإكمال المشروع، مثل الموارد البشرية والمعدات والمواد والمرافق. الموارد القابلة للتخزين ملموسة كالأدوات والآلات، وغير القابلة للتخزين غير ملموسة كالتراخيص والعلامات التجارية وسمعة الشركة. ومفاتيح الإدارة الناجحة ثلاثة:',['توفير الموارد.','جدولة الموارد.','الاستخدام الأمثل للموارد.'],null,'16–17'],
  ['مدير المشروع وفريق العمل','مدير المشروع هو المسؤول الأول عن إكمال المشروع بنجاح. من واجباته:',['وضع خطة المشروع.','توظيف فريق العمل.','قيادة الفريق وإدارته.','وضع الجدول الزمني للمشروع.','تعيين المهام لأعضاء الفريق.','تقديم تقارير محدثة بانتظام للإدارة العليا.','معايير اختيار الفريق: التخصص والخبرات السابقة، والمهارات المتنوعة المتكاملة، والسمات الشخصية كالالتزام والحماس.'],null,'18–19']
 ],

  ['مصطلح التكاليف المتغيرة يعني تكاليف:',['رواتب العاملين','الإيجارات','المواد المستخدمة في الإنتاج','الدعاية فقط'],2,'الرواتب والإيجارات تكاليف ثابتة، أما المواد المستخدمة في الإنتاج فتكاليف متغيرة.'],
  ['إذا زاد نطاق العمل المطلوب في المشروع، فإن ذلك يؤثر حتماً في:',['زمن الانتهاء أو التكلفة أو كليهما','اسم المشروع','عدد صفحات الخطة فقط','لون التقارير'],0,'تغير أحد عناصر المثلث يؤثر في العنصرين الآخرين.'],

{id:'L2',u:'u1',t:'بناء وأتمتة خطة المشروع',pg:'23–36',
 hook:{q:'تود مدرستك تقديم مسرحية، وطلب منك معلمك وضع خطة مشروع حتى يلتزم الفريق بالجدول الزمني. ما الأداة المناسبة؟',o:['برنامج لإدارة المشروعات يُنشئ مخطط جانت','برنامج لتشغيل الفيديو','متصفح الويب فقط'],g:0,
  r:'أدوات إدارة المشروعات تساعد على بناء الخطة وتنظيمها، ومنها تطبيق جانت بروجكت الذي ستنشئ به مخطط جانت لمشروع المسرحية.'},
 goals:['أميّز بين أدوات إدارة المشروعات السحابية والمكتبية.','أضبط خصائص المشروع وأضيف المهام والمهام الفرعية في جانت بروجكت.','أحدد أولويات المهام بطريقة ABC وطريقة أيزنهاور.'],
 cards:[
  ['برامج إدارة المشروعات','تتنوع بين أدوات سحابية تعاونية مثل مايكروسوفت بلانر وتريللو وجيرا وأسانا، وأدوات مكتبية مثل جانت بروجكت. وأهم معيار في اختيار البرنامج هو حجم الفريق وحجم المشروع. يشيع جانت بروجكت في الإنشاءات والإعلام والمشروعات متوسطة الحجم ذات المهام المتسلسلة المحددة بالأيام. ويوفر مخطط جانت رسماً تخطيطياً لجدول زمني يساعد في التخطيط والتنسيق وتتبع المهام.',null,null,'23–24'],
  ['خطوات تخطيط مشروع المسرحية','تتضمن الخطة الخطوات الآتية:',['ضبط خصائص المشروع.','إدراج المهام وتغيير خصائصها.','إنشاء مهام فرعية لتتبع التقدم.','إضافة معالم المشروع.','تحديد المواعيد النهائية.','إضافة موارد للمشروع.','تحديد مدير المشروع.','تخصيص الموارد لمهام المشروع.','إضافة العلاقات بين المهام عند الحاجة.','تغيير تاريخ المهمة إذا لزم الأمر.'],null,'25'],
  ['ضبط خصائص المشروع','قبل إضافة المهام تُحدَّد الإعدادات الأساسية للملف: اسم المشروع والمؤسسة القائمة عليه، وأيام نهاية الأسبوع (السبت والجمعة)، وتاريخ بدء المشروع.',null,['قائمة المشروع','الخصائص','الاسم والوصف','التقويم','موافق'],'26–27'],
  ['التخطيط الزمني وتحديد الأولويات','يقدّر مدير المشروع الوقت اللازم لكل مهمة بالتعاون مع الفريق، ويضع المهام في تسلسل منطقي. فلا يمكن تصميم المشهد والأزياء قبل كتابة نص المسرحية. وتوجد طريقتان لتحديد الأولويات:',['طريقة تحليل ABC: تصنَّف الأنشطة في مجموعات A وB وC ثم تُرتَّب حسب الأولوية.','طريقة أيزنهاور: تُقيَّم المهام بحسب مهمة أو غير مهمة، وعاجلة أو غير عاجلة.','المهمة والعاجلة: ينفذها مدير المشروع فوراً.','المهمة وغير العاجلة: يُحدَّد لها تاريخ إنهاء.','غير المهمة والعاجلة: تُفوَّض إلى آخرين.','غير المهمة وغير العاجلة: تُتجاهل.'],null,'28–29'],
  ['إضافة المهام وتغيير خصائصها','يُقسَّم المشروع إلى مهام أصغر مثل «الإنتاج». ولتعديل خصائص المهمة تضغط عليها ضغطة مزدوجة، فتحدد تاريخ البدء والمدة.',null,['قائمة المهام','مهمة جديدة','كتابة الاسم','ضغطة مزدوجة','تاريخ البدء والمدة'],'29–31'],
  ['المهام الفرعية وأولوية المهمة','يسمح جانت بروجكت بتقسيم المهمة إلى مهام فرعية، مثل تقسيم «الإخراج» إلى «الموسيقى» و«المشهد» و«الأزياء». تحدد المهام ثم تضغط بزر الفأرة الأيمن وتختار «مسافة بادئة» (Indent)، ولإلغائها تختار (Unindent). ولإعطاء أولوية لمهمة تضغط عليها ضغطة مزدوجة وتختار من قسم الأولوية (Priority) مثل الأعلى (Highest).',null,null,'32–34']
 ],

  ['لإضافة مهمة جديدة في جانت بروجكت نستخدم قائمة:',['المهام ثم مهمة جديدة','المشروع ثم التصدير','الملف ثم الطباعة','التقويم ثم الحذف'],0,'المسار: قائمة المهام (Tasks) ثم مهمة جديدة (New task).'],

  ['عند صعوبة تقدير مدة النشاط، يُقدَّر أفضل السيناريوهات وأسوأها ثم:',['يُلغى النشاط','يُترك دون تقدير','يُتوصَّل إلى حل وسط بينهما','يؤجل المشروع سنة'],2],

{id:'L3',u:'u1',t:'إدارة المهام',pg:'37–53',
 hook:{q:'في مشروع المسرحية لا يمكن الانتقال إلى العرض الأول دون إتمام البروفات. ماذا نسمي حدثاً كهذا في إدارة المشروع؟',o:['معلم رئيس (Milestone)','مورد','مهمة فرعية'],g:0,
  r:'المعلم الرئيس نقطة تمثل حدثاً رئيساً في دورة حياة المشروع، وعند الوصول إليه ينتقل المشروع إلى مرحلة أخرى. وتعد البروفات معلماً رئيساً في مشروع المسرحية.'},
 goals:['أميّز المعلم الرئيس من الموعد النهائي.','أشرح أنواع العلاقات (التبعيات) بين المهام.','أضيف المعالم والأدوار والموارد والتبعيات وأتتبع التقدم في جانت بروجكت.'],
 cards:[
  ['المعلم الرئيس والموعد النهائي','المعلم الرئيس (Milestone) نقطة تمثل حدثاً رئيساً في دورة حياة المشروع، وعند الوصول إليه ينتقل المشروع إلى مرحلة أخرى. أما الموعد النهائي (Deadline) فهو آخر وقت أو تاريخ يمكن فيه إكمال جميع مهام المشروع، ويظهر في عمود تاريخ الانتهاء (End date).',null,null,'37'],
  ['ميزات الموعد النهائي','',['يحدد جدولاً معيناً للإنتاجية.','يحسن الانضباط وأخلاقيات العمل.','يوفر إحساساً بالإنجاز.','يقلل التأجيل والمماطلة.','يمنع جدولة أحمال زائدة عن الإمكانيات المتوفرة.'],null,'37'],
  ['ما يُراعى عند تحديد الموعد النهائي','',['أن تكون المواعيد واقعية ومتوازنة.','السماح بهامش للخطأ أو التأخير.','إعلام العاملين بالخطة الزمنية وتذكيرهم بها دورياً.','التأكد من كفاية الموارد للانتهاء في الوقت المحدد.'],null,'37'],
  ['العلاقات (التبعيات) بين المهام','التبعيات (Dependencies) هي العلاقات بين المهام، فبعض المهام تعتمد على غيرها، ولا يمكن مثلاً أن يقرأ الممثلون السيناريو إلا بعد كتابته. وتوجد أربعة أنواع للعلاقات المنطقية:',['النهاية للبداية (Finish to Start): تنتهي المهمة الحالية قبل بدء اللاحقة، كالطلاء الداخلي بعد بناء الجدار.','النهاية للنهاية (Finish to Finish): تنتهي المهمتان معاً، كالفحص النهائي بعد انتهاء مهام التجديد.','البداية للبداية (Start to Start): تبدأ المهمتان معاً، كإعادة الأسلاك الكهربائية التي لا تبدأ إلا مع بدء الهدم.','البداية للنهاية (Start to Finish): تبدأ مهمة قبل أن تنتهي مهمة أخرى.'],null,'38'],
  ['إضافة معلم رئيس','تُعد بروفات اللباس معلماً رئيساً في مشروع المسرحية. وفي الجدول الزمني يظهر المعلم بعلامة على شكل معين بتاريخ ثابت.',null,['زر أيمن على المهمة','خصائص المهمة','تحديد Milestone','موافق'],'38–39'],
  ['أدوار الموارد وتحديد الموارد','عند إضافة مورد جديد لملف مشروع قيد الإنشاء يكون أول دور في النظام هو دور مدير المشروع. أنشئ الأدوار أولاً (مدير الإنتاج، المخرج...) لتتوفر عند إضافة الموارد.',null,['قائمة المشروع','الخصائص','أدوار الموارد','إضافة','مورد جديد'],'40–42'],
  ['تعيين المهام للموارد','من تبويب جانت تضغط بزر الفأرة الأيمن على مهمة، ثم خصائص المهمة، ثم تبويب الموارد، فتختار اسم المورد. وتعرض علامة تبويب مخطط الموارد (Resources Chart) المهام التي يشارك فيها كل عضو.',null,['خصائص المهمة','تبويب الموارد','اختيار المورد','موافق'],'43–44'],
  ['إضافة التبعيات وتتبع التقدم','تضاف التبعية من تبويب المهمة السابقة (Predecessors) في خصائص المهمة، وتظهر بسهم أسود. ولتحديث التقدم تضغط على المهمة ضغطة مزدوجة وتكتب النسبة المئوية في حقل التقدم (Progress)، مثل 75، وأفضل وقت لذلك بعد كل اجتماع للفريق.',null,null,'45–48'],
  ['التصدير','يمكن تصدير خطة المشروع بتنسيقات متعددة مثل PDF أو صورة أو جدول بيانات، من قائمة المشروع ثم تصدير (Export).',null,null,'49']
 ],

  open:['ما الفرق بين الموعد النهائي (Deadline) والمعلم الرئيس (Milestone)؟','الموعد النهائي آخر وقت أو تاريخ يمكن فيه إكمال جميع مهام المشروع، أما المعلم الرئيس فنقطة تمثل حدثاً رئيساً في دورة حياة المشروع، وعند الوصول إليها ينتقل المشروع إلى مرحلة أخرى.']},

 ],

  ['لا يمكن إتمام الفحص النهائي حتى تنتهي مهام التجديد. نوع العلاقة:',['البداية للبداية','النهاية للنهاية','النهاية للبداية','البداية للنهاية'],1],

{id:'L4',u:'u2',t:'دورة حياة النظام',pg:'55–68',
 hook:{q:'تريد تطبيقاً يعرض المعالم السياحية في المملكة لكبار السن ممن لديهم مشكلات في الرؤية أو ارتعاش اليدين. ما الخطوة الأولى لنجاح المشروع؟',o:['البدء بكتابة الشيفرة','تحديد المشكلة ومتطلبات حلها بدقة','نشر التطبيق في المتجر'],g:1,
  r:'الخطوة الأولى لنجاح أي مشروع هي تحديد المشكلة التي تحتاج إلى حل، ثم تحديد متطلبات حلها بأكبر قدر ممكن من الدقة، وهذه مرحلة التحليل.'},
 goals:['أرتب مراحل دورة حياة النظام وأصف كل مرحلة.','أميّز المتطلبات الوظيفية من غير الوظيفية.','أقارن بين طرق جمع المتطلبات: الاستبانات والمقابلات والملاحظة وفحص التوثيقات.'],
 cards:[
  ['دورة حياة النظام','توفر دورة حياة النظام (System Life Cycle) إطار عمل لتنظيم عمليات إنتاج أي نظام بشكل ممنهج، وتمتد فائدتها إلى تحسين إدارة الإنتاج والتطوير والاستخدام الأمثل للموارد. وفي أنظمة تقنية المعلومات والاتصالات تتكون من المراحل الآتية، ويستمر التوثيق والتقييم في جميعها.',null,['التحليل','التصميم','التطوير والاختبار','التنفيذ','الصيانة'],'55'],
  ['1. التحليل','يُحدَّد فيه المستخدمون واحتياجاتهم ومتطلباتهم، وتُؤخذ في الاعتبار الموارد البشرية والمادية والتكاليف والميزانية والوقت. ومن أشهر أدوات جمع البيانات: الاستبانات والمقابلات. وفي تطبيق المعالم السياحية ينبغي أن يكون حجم الأزرار قابلاً للتعديل لتناسب من يعانون الرعاش أو مشكلات الرؤية.',null,null,'56'],
  ['2. التصميم','يقدم محلل النظم خبرته في بناء هيكلية النظام، وتُقسَّم المشكلة الرئيسة إلى مشكلات أصغر يمكن حلها بالحاسب. وتعمل هذه المرحلة على:',['تحديد تدفق البيانات والمعلومات في النظام.','تحديد هياكل البيانات المستخدمة.','تحديد مكان وكيفية تخزين البيانات لتكون آمنة وسهلة الوصول.','تصميم التقارير ومخرجات البيانات.','تصميم واجهة المستخدم وتحديد وظائف عناصرها.','تصميم واجهة تبادل البيانات مع الأنظمة الأخرى.','تحديد طريقة اختبار النظام.'],null,'57'],
  ['3. التطوير والاختبار','يحول المبرمجون ومختبرو النظام المتطلبات والمواصفات إلى مقاطع برمجية. ولا يمكن فصل التطوير عن الاختبار، فيُختبر النظام أثناء التطوير وبعده بطرق مختلفة:',['اختبار صحة البيانات المدخلة.','اختبار وظائف النظام وقابلية الاستخدام.','اختبار أخطاء التصميم والتشغيل.','اختبار الاتصال مع الأنظمة الأخرى.'],null,'58–59'],
  ['4. التنفيذ و5. الصيانة','في التنفيذ يُنشر النظام ويُثبَّت في الموقع المستهدف ليكون جاهزاً للعمل، وقد يحتاج المستخدمون إلى تدريب، وقد تُنقل البيانات من النظام القديم. ويتاح التطبيق عبر متاجر مثل جوجل بلاي. أما الصيانة فتعالج الأخطاء وتضبط النظام لبيئات العمل وتضيف تحسينات وميزات بناءً على ملاحظات المستخدمين.',null,null,'59'],
  ['6. التوثيق و7. التقييم','التوثيق مهمة ثابتة تبدأ مع التخطيط وتستمر حتى الصيانة، فيصف التصميم والتطوير والاختبار والتنفيذ وسجلات الصيانة، ويشمل تعليقات داخل المقاطع البرمجية ودليل المستخدم. أما التقييم فتُقيَّم به كل مرحلة، ومن مجالاته كفاءة النظام وسهولة الاستخدام والملاءمة للمهمات، ويقوم به فريق تقنية المعلومات والمستخدمون والإدارة.',null,null,'60'],
  ['المتطلبات الوظيفية وغير الوظيفية','المتطلبات الوظيفية تحدد ما يجب على النظام القيام به، مثل المستخدمين وأدوارهم، والأزرار ووظائفها، وطرق التصفح والبحث، والرسائل والتنبيهات، والتقارير، والتكامل مع التطبيقات الأخرى. أما غير الوظيفية فتصف خصائص الجودة والمعايير التي تحكم التشغيل:',['الأداء وعدد المستخدمين وزمن الاستجابة.','الموثوقية وإمكانية استرداد النظام عند الطوارئ.','سهولة الصيانة والأمان والتراخيص.','سهولة الاستخدام والتوافق التشغيلي.','مثال: استرجاع البيانات غير المحفوظة عند انقطاع الطاقة.'],null,'60–61'],
  ['طرق جمع المتطلبات','',['الاستبانات: وقت أقل وتكلفة محدودة، لكن قد تكون الإجابات غير صحيحة إذا لم تتضح الأسئلة.','المقابلات: تفسير فوري للأسئلة ودقة أعلى، لكنها مكلفة وتستغرق وقتاً.','الملاحظة: تكشف تفاصيل دقيقة، لكن قد يعمل الشخص الملاحَظ بطريقة مختلفة عن طبيعته.','فحص توثيقات النظام: توفر الوقت وهي الأكثر واقعية، لكنها تعتمد على جودة الوثائق.','عادةً تُستخدم أكثر من طريقة للحصول على مخرجات دقيقة وواقعية.'],null,'62–64']
 ],

  open:['وضح دور المستخدم في مرحلتين من مراحل دورة حياة النظام.','مثال: في التحليل يعبّر عن احتياجاته عبر الاستبانات والمقابلات، وفي التقييم يقيّم النظام ويقدم ملاحظاته، وتبنى الصيانة على تعليقاته.']},

  ['المرحلة التي تُستخدم فيها أدوات جمع البيانات هي:',['التصميم','التحليل','التنفيذ','الصيانة'],1,'الاستبانات والمقابلات تُستخدم في التحليل.'],
  ['المرحلة التي تُستخدم فيها لغة برمجة لإعداد النظام:',['التقييم','التحليل','التطوير','التوثيق'],2,'في التطوير تُحوَّل المتطلبات إلى مقاطع برمجية.'],
  ['المرحلة التي يُعد فيها دليل المستخدم للنظام:',['التوثيق','التحليل','الاختبار','التصميم'],0,'دليل المستخدم من إجراءات التوثيق.'],

 hook:{q:'تريد توضيح خطوات عملية معقدة لزميلك. ما أنسب طريقة؟',o:['فقرة طويلة بلا ترتيب','مخطط بأشكال وأسهم يمثل الخطوات','أرسل له الملف دون شرح'],g:1,

 goals:['أعرّف المخطط وأميّز أنواعه: سير العمل، حالة الاستخدام، الشجرة، الهيكلي.','أتعرف الأشكال الأساسية لمخطط سير العمل.','أنشئ مخطط سير عمل وأصدّره باستخدام تطبيق دياجرام (draw.io).'],
 cards:[
  ['المخططات وأهميتها','المخطط (Diagram) تمثيل مرئي للمعلومات باستخدام الأشكال والأسهم لعرض الترتيبات والعلاقات بينها. يبسط العمليات المعقدة، وتحليله يكشف القصور، وتوظيف الأشكال والألوان يسهل مقارنة البيانات. من استخداماته: الهيكل التنظيمي لمؤسسة، وتمثيل خطوات متتابعة، وشبكات الحاسب وتوصيلاتها.',null,null,'69'],
  ['أنواع المخططات','',['مخطط سير العمل: يوضح تدفق المهام خلال كل مرحلة من دورة حياة النظام.','مخطط حالة الاستخدام: يمثل طرق تفاعل المستخدم مع النظام، ويفيد في تمثيل المتطلبات في مرحلة التحليل.','مخطط الشجرة: يمثل التسلسل الهرمي (جذر وعقد)، ويستخدم في إدارة المشروعات لتقسيم المهام.','المخطط الهيكلي (Wireframe): إطار لموقع أو تطبيق، يركز على بنية المحتوى ووظائف العناصر.','يمكن استخدام أداة فري بلين (Freeplane) لإنشاء أنواع مختلفة من المخططات.'],null,'70–71'],
  ['الأشكال الأساسية لمخطط سير العمل','يُمثَّل كل عنصر في المخطط برمز: البيضاوي للبداية أو النهاية، والمستطيل للعملية أو الوظيفة، والمعين للقرار الذي يؤدي إلى عملية أو قرار آخر، والمستند لناتج عملية مثل تقارير الخطأ، ومتوازي الأضلاع للإدخال أو الإخراج، والسهم لاتجاه التدفق.',null,null,'72'],
  ['تطبيق دياجرام (draw.io)','واجهته رسومية مجانية ومفتوحة المصدر، ويتوفر عبر الإنترنت باسم دياجرام دوت نت (Diagrams.net) وكتطبيق لسطح المكتب. يحفظ المخططات افتراضياً بامتداد XML.',null,['فتح التطبيق','إنشاء رسم جديد','مخطط فارغ','إنشاء'],'73–76'],
  ['بناء مخطط سير العمل','',['إضافة شكل: من لوحة الأشكال تختار الشكل وتسحبه إلى لوحة الرسم.','تنسيق الشكل: تغيير اللون ونمط الخط وحجمه.','إضافة شكل المعين للقرار، وأشكال العمليات والمستندات.','الربط بالموصلات: توضح كيف ترتبط الأشكال ببعضها.','إضافة نصوص مثل «نعم» و«لا» بجانب شكل القرار.'],null,'77–85'],
  ['الحفظ والتصدير','عند اكتمال المخطط يمكن تصديره بتنسيقات متعددة مثل PNG أو PDF أو صفحة إلكترونية.',null,['ملف','تصدير كـ','PDF','تضمين نسخة من المخطط','تصدير'],'86–87']
 ],

  open:['فكّر في مشروع ستكون مسؤولاً عنه، واكتب خطوات مخطط سير العمل له بالكلمات محدداً شكل كل خطوة.','مثال: بداية (بيضاوي) ← إدخال البيانات (متوازي أضلاع) ← معالجتها (مستطيل) ← هل البيانات صحيحة؟ (معين) ← نعم: إصدار تقرير (مستند) ← نهاية (بيضاوي).']},

  ['الشكل الذي يمثل مستنداً ناتجاً عن عملية، مثل تقارير الخطأ:',['المستند','المعين','السهم','البيضاوي'],0,'شكل المستند يمثل ناتج العملية.'],
  ['مخطط يستخدم على نطاق واسع في إدارة المشروعات لتقسيم المهام وتوضيح تفاصيلها الفرعية:',['المخطط الهيكلي','مخطط حالة الاستخدام','مخطط الشجرة','مخطط الشبكة'],2,'يعتمد مخطط الشجرة على الجذر والعقد.'],
  ['المخطط الذي يركز على بنية المحتوى ووظائف العناصر في موقع أو تطبيق:',['مخطط سير العمل','المخطط الهيكلي','مخطط الشجرة','مخطط حالة الاستخدام'],1,'هو الإطار الذي يُصمم قبل الشكل النهائي.'],

{id:'L6',u:'u2',t:'الأمن السيبراني',pg:'90–111',
 hook:{q:'تصفحت موقعاً وتفاعلت مع منشور ثم أغلقت الصفحة. هل بقي أثر لنشاطك؟',o:['لا أثر على الإطلاق','نعم، يبقى أثر يسمى البصمة الرقمية','يبقى الأثر فقط إن حفظت الصفحة'],g:1,
  r:'كل عمل أو تصفح عبر الإنترنت يترك أثراً يسمى البصمة الرقمية، وقد يتمكن آخرون من رؤيتها.'},
 goals:['أبيّن كيف يُدمج الأمن السيبراني في كل مرحلة من دورة حياة النظام.','أصنّف البصمة الرقمية إلى نشطة وغير نشطة، وأشرح تأثيرها.','أفرّق بين جدار الحماية ومكافحة الفيروسات، وأميّز حسابات ويندوز وأذونات الملفات.'],
 cards:[
  ['الأمن السيبراني في دورة حياة النظام','دمج الأمن السيبراني في دورة حياة النظام يضمن أن يكون النظام آمناً ومحمياً من التهديدات:',['التحليل: تحديد متطلبات الأمن السيبراني وتوثيقها.','التصميم: دمج ضوابط الأمن وتصميم النظام ليكون مرناً أمام الهجمات.','التطوير: اتباع التشفير الآمن ومراجعة الشيفرة لإصلاح الثغرات.','الاختبار: اختبار الاختراق ومسح الثغرات الأمنية.','التنفيذ: تنفيذ الضوابط الأمنية عند النشر.','الصيانة: تقييمات أمنية منتظمة وتحديث ضوابط الأمان.'],null,'90'],
  ['الأمن السيبراني في المملكة','تأسست الهيئة الوطنية للأمن السيبراني (NCA) بأمر ملكي، وهي الجهة المختصة بالأمن السيبراني والمرجع الوطني في شؤونه. والأمن السيبراني حماية الشبكات وأنظمة تقنية المعلومات والأنظمة التشغيلية ومكوناتها وبياناتها من أي اختراق أو تعطيل أو تعديل أو استغلال غير مشروع. وتشمل مبادرات المملكة: التعليم والتدريب، والاستراتيجية الوطنية، والشراكات الصناعية، وتطوير القطاع عبر البرنامج الوطني سايبرك (CyberIC) والتمارين الوطنية السيبرانية. وتعمل مؤسسة الاتحاد السعودي للأمن السيبراني والبرمجة والدرونز (SAFCSP) على تمكين القوى العاملة المحلية.',null,null,'91–92'],
  ['البصمة الرقمية','البصمة الرقمية (Digital footprint) هي الأثر الذي يتركه كل عمل أو تصفح عبر الإنترنت. وتُصنَّف إلى صنفين:',['نشطة: بيانات تتركها بإرادتك، كالمنشورات على منصات التواصل، ونماذج الاشتراك في البريد، والرسائل النصية.','غير نشطة: تتركها دون قصد أو دون علمك، كتحديد الموقع الجغرافي، وملفات تعريف الارتباط، واستخدام الإعجابات والتعليقات لتقديم إعلانات مخصصة.'],null,'93'],
  ['تأثير البصمة الرقمية على دورة حياة النظام','',['الأخطار الأمنية: قد يستخدم مجرمو الإنترنت المعلومات المتاحة لشن هجمات احتيالية.','إدارة السمعة: التعليقات السلبية تؤثر في صورة المؤسسة وثقة العملاء.','التوافق: يجب الامتثال لقوانين خصوصية البيانات لتجنب الغرامات.','المراقبة: على المؤسسات مراقبة بصمتها الرقمية بانتظام.'],null,'94'],
  ['آثار التعقب وسجلات الخادم','آثار التعقب الرقمية نوعان: مقصودة ومرئية كرسائل البريد والمنشورات والتعليقات، وغير مقصودة وغير مرئية كسجلات زيارات المواقع وعمليات البحث. وعند تحميل صفحة يسجل الخادم عنوان بروتوكول الإنترنت (IP) وهوية الحاسب وتاريخ الاتصال ووقته وطريقة الطلب واسم الملف المطلوب وحالة HTTP وحجم الملف. وسجلات الخادم أساس لتحليلات الويب، ولا يراها إلا مالكو الموقع.',null,null,'94–95'],
  ['جدار الحماية ومكافحة الفيروسات','لكل منهما وظيفة مختلفة:',['جدار الحماية يراقب حركة مرور الشبكة ويتحكم فيها ويمنع الوصول غير المصرح به، وقد يكون قائماً على الأجهزة أو البرمجيات، ولا يفحص الملفات.','مكافحة الفيروسات تكتشف البرامج الضارة وتمنعها وتزيلها، وتعتمد دائماً على البرمجيات، وتفحص الملفات والبرامج.','في ويندوز: جدار Windows Defender Firewall وبرنامج Microsoft Defender.','لا يحمي جدار الحماية من: الاحتيال الإلكتروني، والإعلانات المنبثقة، والبريد الإلكتروني غير المرغوب فيه.'],null,'96–97'],
  ['حسابات المستخدم في ويندوز','يتيح ويندوز أربعة أنواع من الحسابات:',['حساب المسؤول المدمج: يتمتع بجميع الامتيازات.','حساب مستخدم بامتيازات إدارية: يثبّت البرامج ويغير إعدادات النظام.','حساب مايكروسوفت: يزامن الإعدادات والملفات بين الأجهزة ويتيح خدمات مثل OneDrive وOffice 365.','حساب محلي: يُخزَّن على الجهاز ولا تتم مزامنته مع أي حاسب آخر.'],null,'97–102'],
  ['أذونات الملفات والمجلدات','تُطبَّق أذونات نظام ملفات التقنية الجديدة (NTFS) على كل ملف ومجلد. ولتعديلها تضغط بزر الفأرة الأيمن على الملف أو المجلد ثم خصائص ثم تبويب الأمان ثم تحرير، وتختار السماح (Allow) أو الرفض (Deny). وتُورَّث الأذونات من المجلد الأصل. أنواعها:',['التحكم الكامل: قراءة وكتابة وتعديل وحذف وتغيير الأذونات.','التعديل: قراءة وكتابة وتعديل وحذف الملفات والمجلدات.','القراءة والتنفيذ: عرض الملفات وتشغيل البرامج.','عرض محتويات المجلد.','القراءة والكتابة.'],null,'103–105']
 ],

  open:['ما التهديدات التي لا يحمي منها جدار الحماية؟ اذكر ثلاثة.','الاحتيال الإلكتروني، والإعلانات المنبثقة، والبريد الإلكتروني غير المرغوب فيه.']},
 quiz:[
  ['تتبع الإعلانات المخصصة اعتماداً على إعجاباتك ومشاركاتك مثال على بصمة رقمية:',['نشطة','غير نشطة','محذوفة','مؤقتة بالكامل'],1,'الإعجابات والمشاركات تُستخدم دون قصد منك لتقديم إعلانات مخصصة.'],
  ['الهيئة الوطنية للأمن السيبراني (NCA) هي:',['شركة ألعاب','جامعة','الجهة المختصة بالأمن السيبراني والمرجع الوطني فيه','متجر تطبيقات'],2,'تأسست بأمر ملكي.'],
  ['تُجرى اختبارات الاختراق ومسح الثغرات الأمنية في مرحلة:',['الاختبار','التحليل','الصيانة','التوثيق'],0,'يهدف ذلك إلى كشف ثغرات فاتت أثناء التطوير.'],
  ['الحساب الذي يزامن إعداداتك وملفاتك عبر أجهزة متعددة ويتيح OneDrive:',['حساب محلي','حساب مايكروسوفت','حساب المسؤول المدمج فقط','حساب ضيف'],1,'ارتباطه بخدمات مايكروسوفت يتيح المزامنة.'],
  ['الإذن الذي يسمح بالقراءة والكتابة والتعديل والحذف وتغيير الأذونات:',['القراءة','الكتابة','التحكم الكامل','عرض محتويات المجلد'],2,'التحكم الكامل هو أوسع الأذونات.']
 ],

  ['أي مما يلي يسجله الخادم عند تحميل صفحة؟',['كلمات مرور الزائر','عنوان بروتوكول الإنترنت (IP)','محتوى الرسائل الخاصة','صور الجهاز'],1],
  ['تأثير التعليقات السلبية عن المؤسسة على صورتها وثقة عملائها يندرج تحت:',['إدارة السمعة','التوافق','المراقبة','التشفير'],0],
  ['قد يتعارض مع برامج الأمان الأخرى، مثل برامج مكافحة الفيروسات:',['جدار الحماية','الحساب المحلي','التشفير','ملف PDF'],0],
  ['من آثار التعقب غير المقصودة وغير المرئية:',['رسائل البريد','المنشورات','الصور المنشورة','سجلات زيارات المواقع وعمليات البحث'],3],
  ['إذن «القراءة والتنفيذ» يسمح بـ:',['عرض الملفات وتشغيل الملفات التنفيذية','حذف النظام','تغيير كلمة المرور','تثبيت ويندوز'],0],

{id:'L7',u:'u3',t:'مقدمة عن تطبيقات الهواتف الذكية',pg:'113–119',
 hook:{q:'عندما تضغط أيقونة تطبيق على هاتفك، من يقف بين التطبيق والأجهزة ليشغّله؟',o:['نظام التشغيل (برنامج النظام)','الطابعة','شاحن الهاتف'],g:0,
  r:'برامج النظام، وأهمها نظام التشغيل، هي المسؤولة عن إدارة الأجهزة، وتعمل وسيطاً بين المستخدم والأجهزة، وتعمل التطبيقات في بيئتها.'},
 goals:['أعرّف البرنامج وأميّز برامج النظام من البرامج التطبيقية.','أفرّق بين واجهة المستخدم (UI) وتجربة المستخدم (UX).','أذكر مراحل إنشاء تطبيقات الهواتف الذكية ومميزات برنامج MIT App Inventor.'],
 cards:[
  ['البرنامج وبرامج النظام','البرنامج مجموعة من التعليمات الخاصة بالحاسب تؤدي مهمة محددة، وينقسم إلى برامج النظام والبرامج التطبيقية. برامج النظام (System Software) مسؤولة عن إدارة الأجهزة، وتعمل باستمرار في ذاكرة الحاسب، وتخدم برامج التطبيقات، وهي الوسيط بين المستخدم والأجهزة. أمثلتها: أنظمة التشغيل (ويندوز، أندرويد، macOS، iOS) وبرامج تعريف المكونات المادية مثل برنامج تعريف الطابعة.',null,null,'113'],
  ['البرامج التطبيقية','التطبيقات (App) برامج صُممت لتنفيذ مهام منظمة مفيدة للمستخدم، وقد تكون بسيطة كالحاسبة أو معقدة كمعالج النصوص. أمثلتها: معالج النصوص، وجداول البيانات، والحاسبة، ومستعرض الويب، وتطبيقات تحرير الفيديو.',null,null,'114'],
  ['الفرق بين النوعين','',['الاستخدام: برامج النظام لتشغيل مكونات الحاسب، والتطبيقية لأداء مهمة محددة.','وقت التثبيت: النظام عند تثبيت نظام التشغيل، والتطبيقية وفق حاجة المستخدم.','التعامل مع المستخدم: لا يتعامل المستخدم عادة مع برامج النظام مباشرة، ويتعامل مع التطبيقية مباشرة.','الاستقلالية: برامج النظام تعمل بشكل مستقل، والتطبيقية تعمل في بيئة برنامج النظام.'],null,'114'],
  ['تطبيقات الهواتف الذكية','نوع من البرامج التطبيقية صُمم للعمل على الأجهزة المحمولة كالهواتف الذكية والأجهزة اللوحية. أمثلتها: تطبيقات البريد الإلكتروني، والتواصل الاجتماعي، والرسائل الفورية، والخرائط، والتطبيقات الحكومية.',null,null,'115'],
  ['مراحل إنشاء تطبيقات الهواتف الذكية','تمر عملية الإنشاء بأربع مراحل: في التخطيط والتصميم تحدد الفكرة والهدف والفئة المستهدفة وترسم مخططاً يدوياً للواجهات. في التطوير تنفذ التصميم ببرنامج تطوير. في الاختبار تعالج المشكلات وتضيف اللمسات الأخيرة. وفي النشر والتسويق تعتمد التطبيق وتحمّله في متجر التطبيقات.',null,['التخطيط والتصميم','التطوير (التنفيذ)','الاختبار','النشر والتسويق'],'115'],
  ['واجهة المستخدم وتجربة المستخدم','واجهة المستخدم (UI) هي ما يراه المستخدم ويتفاعل معه، وتعتمد على التوازن والتناسق بين الألوان والصور وعناصر التحكم كالتسميات (Labels) ومربعات النص (Text Boxes) والأزرار (Buttons). أما تجربة المستخدم (UX) فتشير إلى الاهتمام برغبات المستخدم وتوقعاته للوصول إلى احتياجاته بسهولة وفعالية. ومن مواصفات الواجهة الجيدة:',['منظمة بشكل جيد.','بسيطة.','تعمل بكفاءة.','متجاوبة مع حاجات المستخدم.','مرنة.'],null,'116'],
  ['مطور التطبيقات MIT','برنامج MIT App Inventor يُستخدم لإنشاء تطبيقات الهواتف الذكية دون كتابة شيفرة، عبر بيئة اللبنات المشابهة لسكراتش، وقد طُوّر في معهد ماساتشوستس للتقنية. من مميزاته:',['اختصار الوقت: تطبيق في أقل من ساعة.','تنمية مهارات الإبداع وتقليل احتمالات الخطأ.','سهولة مشاركة التطبيقات.','الوصول إلى وظائف الهاتف كالمكالمات والرسائل وأجهزة الاستشعار.','حفظ البيانات عبر التخزين السحابي.'],null,'117']
 ],

  open:['اكتب الفرق بين واجهة المستخدم (UI) وتجربة المستخدم (UX) في تطبيقات الهواتف الذكية.','واجهة المستخدم هي ما يراه المستخدم ويتفاعل معه من ألوان وصور وأزرار ومربعات نص، أما تجربة المستخدم فهي الاهتمام برغباته وتوقعاته ليصل إلى احتياجاته بسهولة وفعالية وبشعور إيجابي.']},

{id:'L8',u:'u3',t:'بناء تطبيقات الهاتف الذكي',pg:'120–138',
 hook:{q:'ستبني أول تطبيق لك عن الغذاء الصحي. ما الذي تفعله قبل فتح برنامج التطوير؟',o:['أخطط للتطبيق: الفكرة والأهداف والفئة المستهدفة، وأرسم شكله المبدئي يدوياً','أختار صورة الخلفية فقط','أنشر التطبيق مباشرة'],g:0,
  r:'قبل التصميم والتطوير يجب التخطيط الجيد: تحديد الفكرة والأهداف والفئة المستهدفة، وتصميم الشكل المبدئي يدوياً.'},
 goals:['أخطط لتطبيق: الفكرة والهدف والفئة المستهدفة.','أتعرف بيئة العمل في MIT App Inventor (المصمم واللبنات).','أصمم شاشات التطبيق وأبرمج زراً لفتح شاشة، وأختبر التطبيق.'],
 cards:[
  ['أولاً: التخطيط والتصميم','يتوجب التخطيط الجيد للتطبيق قبل تصميمه وتطويره:',['تحديد فكرة التطبيق.','تحديد أهداف التطبيق.','تحديد الفئة المستهدفة من استخدامه.','تصميم الشكل المبدئي للتطبيق (يدوياً).'],null,'120–121'],
  ['ثانياً: التطوير (التنفيذ) وبدء البرنامج','ستنشئ تطبيقك الأول بـ MIT App Inventor، ويقدم تصنيفات أساسية للطعام وأمثلة على الأطعمة الصحية ونصائح لأساليب الحياة الصحية.',null,['موقع appinventor.mit.edu','Create Apps','حساب جوجل','Start new project','اسم المشروع بالإنجليزية'],'122–124'],
  ['بيئة العمل','تنقسم واجهة البرنامج إلى صفحتين: صفحة التصميم (Designer) وفيها تصمم التطبيق وتدخل المكونات وتغير خصائصها، وصفحة اللبنات (Blocks) وفيها تبرمج المكونات. وتضم صفحة التصميم: شاشة العرض، وقسم المكونات (Components)، وقسم الخصائص (Properties)، ولوحة الأدوات.',null,null,'125'],
  ['أكثر المكونات استخداماً','',['زر الأمر (Button): يؤدي مهمة محددة عند ضغطه.','صورة (Image): يعرض الصور.','أداة التسمية (Label): تعرض نصاً يُخصص في خاصية Text.','منتقي القائمة (ListPicker): يعرض خيارات نصية للاختيار منها.'],null,'126'],
  ['تصميم الشاشة الرئيسة','تُغيَّر خاصية Title لتصبح عنوان الشاشة «الصفحة الرئيسة»، ويُسحب زر أمر من لوحة الأدوات ويُعاد تسميته ويُكتب نصه «نصائح صحية». ويُضبط المحاذاة (AlignHorizontal وAlignVertical) إلى التوسيط، وتُضاف صورة خلفية (BackgroundImage). ويمكن تغيير لون الزر والخط الغامق ولون النص.',null,null,'126–129'],
  ['شاشة النصائح','تُضاف شاشة جديدة (Add Screen) باسم إنجليزي يبدأ بحرف ولا يبدأ برقم. وتُستخدم مكون الترتيب العمودي (VerticalArrangement) لعرض النصائح من أعلى إلى أسفل، ويُضاف داخله Label لكل نصيحة.',null,null,'130–132'],
  ['برمجة الزر باللبنات','في صفحة اللبنات تبرمج الزر لفتح الشاشة الثانية: تستخدم لبنة when Tips.Click التي تعني عند الضغط على Tips، وتضع داخلها لبنة open another screen وتختار الشاشة الثانية.',null,['صفحة Blocks','اختيار الزر','when Tips.Click','open another screen','Screen2'],'133–134'],
  ['ثالثاً: اختبار التطبيق','تتوفر طريقتان للاختبار: المحاكي (Emulator)، وهو برنامج على الحاسب يحاكي الهاتف الذكي، ومصاحب الذكاء الاصطناعي (AI Companion)، وهو تطبيق تثبته على هاتفك ويمسح رمز QR لتحميل تطبيقك. وعند إغلاق البرنامج يُزال التطبيق التجريبي، لذلك يجب تثبيته على الهاتف ليُحفظ.',null,null,'135–137']
 ],

{id:'L9',u:'u3',t:'برمجة التطبيق',pg:'139–160',
 hook:{q:'عند ضغطك على «الأطعمة الصحية» تظهر قائمة بأصناف الطعام. ما المكون الذي يعرض قائمة تختار منها؟',o:['منتقي القائمة (ListPicker)','الصورة (Image)','الشاشة الفارغة'],g:0,
  r:'منتقي القائمة (ListPicker) يُضغط عليه لعرض عدة خيارات نصية للاختيار من بينها.'},
 goals:['أنشئ قائمة بالعناصر وأفعّلها باستخدام منتقي القائمة.','أستخدم المتغيرات المحلية والعامة وجملة if الشرطية.','أبرمج فتح الشاشات من القائمة وأنشئ ملف APK.'],
 cards:[
  ['القوائم ومنتقي القائمة','القوائم نوع من تراكيب البيانات تُستخدم لإنشاء وإدارة مجموعات من القيم أو العناصر. وعند الضغط على زر الأطعمة الصحية تظهر قائمة: اللحوم والأسماك، الحبوب، الخضراوات، الفواكه، منتجات الحليب، المكسرات. ولتضمين قائمة خطوتان: إضافة مكون ListPicker، ثم إعطاؤه العناصر بلبنة make a list وإضافة نصوص لكل عنصر.',null,null,'139–142'],
  ['المتغيرات','المتغير موقع تخزين يحتوي على قيمة يمكن أن تتغير أثناء تنفيذ التطبيق، ويخزن أرقاماً أو نصوصاً أو قوائم. نوعاه:',['المتغيرات المحلية (Local): لا تُستخدم إلا داخل لبنة محددة.','المتغيرات العامة (Global): يمكن استخدامها أو تغيير قيمتها في أي جزء من التطبيق، وتُعرَّف بلبنة initialize global name to.'],null,'143–144'],
  ['برمجة قائمة الطعام','تنشئ متغيراً عاماً Foods وتربطه بالقائمة، وتنشئ متغيراً عاماً selection بنص فارغ. وعند فتح القائمة تستخدم لبنة when Foods.BeforePicking التي تضبط عناصر القائمة بلبنة set Foods.Elements to.',null,['make a list','global Foods','when Foods.BeforePicking','set Foods.Elements'],'144–146'],
  ['شاشة العنصر والصورة','ينشأ لكل صنف شاشة تحتوي Labels وصورة (Image). تُرفع الصورة من الحاسب بخاصية Picture، ويُضبط الارتفاع (Height) إلى 30 بالمئة والعرض (Width) إلى 50 بالمئة.',null,null,'147–149'],
  ['الاختيار بجملة if الشرطية','عند اختيار عنصر تُستخدم لبنة when Foods.AfterPicking وتضبط المتغير global selection ليساوي Foods.Selection. ثم تُستخدم لبنة if then لمقارنة الاختيار بنص الصنف، مثل «اللحوم والأسماك»، فإذا تحقق الشرط فُتحت الشاشة المقابلة بلبنة open another screen.',null,['when Foods.AfterPicking','set global selection','if then','open another screen'],'150–154'],
  ['القائمة الفرعية','يتضمن بعض الأصناف، مثل الحبوب، أصنافاً فرعية، فتُنشأ قائمة جديدة لها تُعيَّن إلى المتغير Foods، وتوضع داخل لبنة if لتظهر عند الضغط على الصنف الرئيس.',null,null,'155–156'],
  ['رابعاً: النشر والتسويق','حزمة أندرويد (APK) هي تنسيق ملف يستخدمه أندرويد لتوزيع التطبيقات وتثبيتها، كما تستخدم ملفات exe في ويندوز. لإنشائها تضغط Build ثم Android App (.apk)، ثم تحفظ الملف على الحاسب أو تأخذ رمز QR. ورمز QR المولَّد لتنزيل الملف صالح لمدة ساعتين فقط.',null,['Build','Android App (.apk)','شريط التقدم','حفظ الملف أو رمز QR'],'157']

{id:'L10',u:'u4',t:'الذكاء الاصطناعي في الواقع العملي',pg:'161–171',
 hook:{q:'تسأل مساعداً صوتياً: «ما الطقس اليوم؟» فيجيبك بصوته. ما الذي يحدث بين سؤالك وجوابه؟',o:['يحوّل صوتك إلى نص ويفهم المعنى ثم يرد صوتياً','يعرض جواباً مسجلاً مسبقاً دائماً','لا يحدث شيء'],g:0,
  r:'يتعرف المساعد على الكلام ويحوله إلى نص، ثم يفهم المعنى بمعالجة اللغة الطبيعية، ثم يجيب بتحويل النص إلى كلام.'},
 goals:['أشرح كيف يعمل تعلم الآلة ومعالجة اللغة الطبيعية والتعرف على الكلام في المساعدات الصوتية.','أنشئ مساعداً صوتياً بسيطاً في MIT App Inventor.','أقيّم الاستخدام الأخلاقي للذكاء الاصطناعي: الشمولية والخصوصية والمساءلة.'],
 cards:[
  ['تعلّم الآلة','تعلم الآلة (Machine Learning) جزء من الذكاء الاصطناعي يساعد الحاسب على التعلم من البيانات والتجربة كما يتعلم البشر بالممارسة. فبدل أن يُملى عليه ما يفعله بدقة، يتعرف على أنماط من أمثلة متعددة ثم يتنبأ. ومثال ذلك المساعد الصوتي الذي يستمع إلى ملايين الأصوات واللهجات فيصبح أكثر قدرة على فهم الجميع.',null,null,'162'],
  ['معالجة اللغة الطبيعية','تساعد معالجة اللغة الطبيعية (NLP) الحاسب على فهم معنى ما يقوله الناس أو يكتبونه، فيتعلم من ملايين الجمل في الكتب والمواقع والمحادثات كيف تظهر الكلمات معاً وأنماط المعنى. فيفهم مثلاً أن «كيف حالك؟» تحية وليست سؤالاً حقيقياً، وأن «أشعل الضوء» و«أوقد الضوء» تعنيان الشيء نفسه.',null,null,'162'],
  ['كيف يعمل الذكاء الاصطناعي؟','يعطي خبير الذكاء الاصطناعي الحاسب أمثلة عديدة تسمى بيانات، فيبحث النظام عن الأنماط ويتحسن بالتدريب المتكرر. وبعد تدريبه يتنبأ بأشياء جديدة لم يرها من قبل، وتتم خطوة التنبؤ بسرعة كبيرة. وتمر دورة التفاعل بثلاث مراحل: الإدخال (تسأل)، والمعالجة (يحوّل صوتك إلى نص ويفهمه)، والإخراج (يجيب).',null,['البيانات','التدريب','التنبؤ'],'163'],
  ['التعرف على الكلام','يمكّن التعرف على الكلام (Speech Recognition) الحاسب من الاستماع إلى اللغة المنطوقة وتحويلها إلى نص مكتوب. ويُستخدم في المساعدات الصوتية والكتابة الصوتية وأدوات تعلم اللغة (التحقق من النطق) وأجهزة المنزل الذكي.',null,null,'163'],
  ['المساعد الصوتي','المساعد الصوتي أداة ذكاء اصطناعي تستمع إلى صوتك وتفهم ما تقوله وتستجيب بطريقة مفيدة، فيجيب عن الأسئلة ويشغل الموسيقى ويضبط التذكيرات. ويزداد ذكاؤه بتحليل بيانات الاستخدام. ويعتمد على ثلاث تقنيات:',null,['التعرف على الكلام','معالجة اللغة الطبيعية','تحويل النص إلى كلام'],'164'],
  ['أخلاقيات الذكاء الاصطناعي','يجب التفكير ملياً في كيفية استخدام الذكاء الاصطناعي:',['الشمولية: يجب أن يعمل للجميع بغض النظر عن اللغة أو اللهجة أو القدرة.','الخصوصية: تجمع الأدوات بياناتك مثل صوتك وموقعك، ويجب أن تطلب إذنك وتحمي معلوماتك.','المساءلة: قد يخطئ الذكاء الاصطناعي، وتتشارك الشركات والمطورون والمستخدمون مسؤولية استخدامه بحكمة.'],null,'164–165'],
  ['برمجة المساعد الصوتي','في مشروع My_Voice_Assistant تُضاف مكونات الواجهة: Label وTextBox وزر Save وصورة وزر ميكروفون وWebViewer، ومن فئة الوسائط TextToSpeech وSpeechRecognizer. ثم يُبرمج التطبيق كما يأتي:',['متغيران عامان name وmessage يبدآن نصاً فارغاً.','عند الضغط على Save يقول TextToSpeech: Hello, [name]! How can I help you?','عند الضغط على الميكروفون يحصل SpeechRecognizer على النص.','إذا كانت النتيجة How are you? فالرد I’m fine, thanks.','وإلا يفتح WebViewer بحث جوجل للحصول على النتيجة.'],null,'165–171']
 ],

  for(var i=idx.length-1;i>0;i--){x=(x*1103515245+12345)%2147483648;var j=x%(i+1);var t=idx[i];idx[i]=idx[j];idx[j]=t}

}

function h(tag,a){
  var e=document.createElement(tag);
  if(a){for(var k in a){var v=a[k];
    if(k==='class')e.className=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);}}
  for(var i=2;i<arguments.length;i++){add(e,arguments[i])}
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x)});return}
  e.appendChild(c.nodeType?c:document.createTextNode(String(c)));
}
